name: Deploy to S3

on:
  push:
    branches: [main]
    paths:
      - 'index.html' # add more paths here (css/, js/, images/) as the site grows

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to S3
        run: aws s3 cp index.html s3://thangkhuat-dev-portfolio/index.html

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EABS056L8C7G4 --paths "/*"
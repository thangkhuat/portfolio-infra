name: Deploy to S3

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**' # the contact form's submit module

  # Lets the deploy be run by hand from the Actions tab. Useful for
  # verifying credentials or re-pushing the current file without having
  # to make a throwaway edit just to trip the path filter above.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Infrastructure facts live in repository variables, not in this file.
    # Both are identifiers rather than credentials, so they're variables
    # and not secrets. Values come from `terraform output` — see
    # docs/bootstrap.md.
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    # ADR-010: declared explicitly rather than left to the default,
    # which grants GITHUB_TOKEN write access across the board.
    permissions:
      id-token: write # required — lets the job request an OIDC token. Without it, the step below fails
      contents: read # only needs to read the repo to check it out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before credentials are assumed, so a misconfigured repo fails
      # immediately with a readable message rather than an opaque CLI error
      # partway through the deploy. Note this catches a MISSING value, not a
      # stale one — see docs/bootstrap.md.
      - name: Check deploy configuration
        run: |
          missing=""
          if [ -z "$SITE_BUCKET" ]; then missing="$missing SITE_BUCKET"; fi
          if [ -z "$DISTRIBUTION_ID" ]; then missing="$missing CLOUDFRONT_DISTRIBUTION_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing — add them under Settings > Secrets and variables > Actions > Variables. Values come from 'terraform output'."
            exit 1
          fi

      # Exchanges a short-lived, GitHub-signed OIDC token for temporary
      # AWS credentials (~1h). No access keys are stored in this repo.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # A repository VARIABLE, not a secret — an ARN is an identifier,
          # not a credential. Holding it grants nothing; the role's trust
          # policy (see main.tf) is what actually gates access. Kept out of
          # the committed file only to avoid publishing the account ID.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      # Two explicit copies rather than `aws s3 sync`. sync compares local
      # against remote and therefore needs s3:ListBucket, which the deploy
      # role deliberately does not have — its policy is exactly PutObject
      # plus CreateInvalidation (ADR-010). Widening it to save one line
      # would weaken the "worst case is defacement" property for no gain,
      # since the site is two files. Revisit if assets/ ever grows enough
      # that listing them here stops being reasonable.
      - name: Deploy to S3
        run: |
          aws s3 cp index.html "s3://$SITE_BUCKET/index.html"
          aws s3 cp assets/contact-form.js "s3://$SITE_BUCKET/assets/contact-form.js" \
            --content-type "text/javascript"

      # Destroying and recreating the distribution assigns a new ID, so a
      # hardcoded copy would go on invalidating a distribution that no longer
      # serves the site — while still reporting success. Refresh the variable
      # with `terraform output cloudfront_distribution_id`.
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"